name: contract-shield-web
services:
  - name: web
    environment_slug: node-js
    source_dir: frontend
    build_command: npm ci && npm run build
    run_command: npm run start -- -p 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: https://your-api-domain.ondigitalocean.app
    github:
      branch: main
      deploy_on_push: true
      repo: YOUR_GITHUB_ORG/Contract-sheild
